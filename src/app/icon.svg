<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Solid tile so the mark stays legible on both light and dark tab bars. -->
  <rect width="32" height="32" rx="7" fill="#175CD3"/>
  <!-- Three bars advancing: a line in motion. -->
  <rect x="7"    y="9" width="4.5" height="14" rx="2.25" fill="#ffffff" opacity="0.45"/>
  <rect x="13.75" y="9" width="4.5" height="14" rx="2.25" fill="#ffffff" opacity="0.72"/>
  <rect x="20.5" y="9" width="4.5" height="14" rx="2.25" fill="#ffffff"/>
</svg>
